name: Build ArtDent Harly demo image

on:
  workflow_dispatch:
  push:
    branches: [feat/ru-briefing-hh-demo]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/kovalevivan/harly:demo-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/kovalevivan/harly
          cache-from: type=gha
          cache-to: type=gha,mode=max
